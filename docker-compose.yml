version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mer_pipeline
      POSTGRES_USER: mer
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mer -d mer_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mer:${DB_PASSWORD}@db:5432/mer_pipeline
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_TIER1_CHAT_ID: ${TELEGRAM_TIER1_CHAT_ID}
      FRED_API_KEY: ${FRED_API_KEY}
      BOK_API_KEY: ${BOK_API_KEY}
    volumes:
      - ./data:/app/data

  dashboard:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mer:${DB_PASSWORD}@db:5432/mer_pipeline
    ports:
      - "8501:8501"
    command: streamlit run src/dashboard/prediction_dashboard.py --server.address=0.0.0.0

volumes:
  pgdata:
