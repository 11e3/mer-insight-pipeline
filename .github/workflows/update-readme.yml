name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mer_test
          POSTGRES_USER: mer
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mer -d mer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://mer:testpass@localhost:5432/mer_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio anyio anthropic asyncpg pytest-cov requests python-dotenv ruff rank-bm25

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/ --select E,W,F --ignore E501,E402,F841

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/test_integration_dispatcher.py --cov=src --cov-report=xml --tb=short

      - name: Run integration tests
        run: pytest tests/test_integration_dispatcher.py -v --tb=long -s --cov=src --cov-report=xml --cov-append

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
