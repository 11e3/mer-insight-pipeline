name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mer_test
          POSTGRES_USER: mer
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mer -d mer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://mer:testpass@localhost:5432/mer_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio anyio anthropic asyncpg pytest-cov requests

      - name: Diagnose imports
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import pytest; print('pytest', pytest.__version__)"
          python -c "import pytest_asyncio; print('pytest-asyncio', pytest_asyncio.__version__)"
          python -c "import pytest_cov; print('pytest-cov OK')"
          python -c "from src.delivery.formatters import _esc; print('formatters OK')"
          python -c "from scripts.update_readme import update_section; print('update_readme OK')"
          python -c "import os; [os.environ.setdefault(k,'test') for k in ('DATABASE_URL','ANTHROPIC_API_KEY','GCP_PROJECT_ID','TELEGRAM_BOT_TOKEN','TELEGRAM_TIER1_CHAT_ID','DART_API_KEY','BOK_API_KEY','NAVER_CLIENT_ID','NAVER_CLIENT_SECRET')]; from src.pipeline.prediction_verifier import PredictionVerifier; print('prediction_verifier OK')"
        continue-on-error: true

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/test_integration_dispatcher.py --cov=src --cov-report=xml --tb=short

      - name: Run integration tests
        run: pytest tests/test_integration_dispatcher.py -v --cov=src --cov-report=xml --cov-append

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  update-readme:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run update script
        run: python scripts/update_readme.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README_KR.md
          if git diff --cached --quiet; then
            echo "README unchanged."
          else
            git commit -m "docs: auto-update README [skip ci]"
            git push
          fi
